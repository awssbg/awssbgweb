 [build]
  command = "npm run build"
  publish = "site"
  functions = "netlify/functions"

[[redirects]]
  from = "/certification-practice"
  to = "/certification-practice.html"
  status = 200

[[redirects]]
  from = "/certification-practice/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/certification-practice/styles.css"
  to = "/styles.css"
  status = 200

[[redirects]]
  from = "/certification-practice/certification-practice.css"
  to = "/certification-practice.css"
  status = 200

[[redirects]]
  from = "/certification-practice/certification-overrides.css"
  to = "/certification-overrides.css"
  status = 200

[[redirects]]
  from = "/certification-practice/certification-services.js"
  to = "/certification-services.js"
  status = 200

[[redirects]]
  from = "/certification-practice/supabase-public-config.js"
  to = "/supabase-public-config.js"
  status = 200

[[redirects]]
  from = "/certification-practice/certification-cloud-flow.js"
  to = "/certification-cloud-flow.js"
  status = 200

[[redirects]]
  from = "/certification-practice/*"
  to = "/certification-practice.html"
  status = 200
